{# Shared "Your account" panel shown on the Buyer and Seller dashboards. #}
<section class="panel" aria-labelledby="account-title">
  <div class="panel-header">
    <h2 id="account-title">Your account</h2>
  </div>
  <dl class="detail-list detail-list-stacked">
    <div><dt>Name</dt><dd>{{ g.user.name }}</dd></div>
    <div><dt>Email</dt><dd>{{ g.user.email }}</dd></div>
    <div><dt>Account type</dt><dd><span class="badge badge-{{ g.user.role | lower }}">{{ g.user.role }}</span></dd></div>
    <div><dt>Member since</dt><dd>{{ g.user.created_at | date }}</dd></div>
  </dl>
  <div class="panel-footer">
    <a class="button button-secondary" href="{{ url_for('profile') }}">Edit profile</a>
    <a class="text-link" href="{{ url_for('profile') }}#password-title">Change password</a>
  </div>
</section>
